name: Release

# Run by hand from the Actions tab on the default branch. It computes the next version from the
# `v*` tags (or takes the one given), builds the image, checks that it starts, pushes it to
# ghcr.io/blackhole1/mewte as X.Y.Z, X.Y and latest for linux/amd64 and linux/arm64, tags the
# commit and publishes a GitHub Release with generated notes. Nothing is committed: the version
# exists only as the git tag and the image tags.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z (empty computes it from the latest tag and the bump)
        required: false
        type: string
        default: ""
      bump:
        description: Part of the latest version to increase when no version is given
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/blackhole1/mewte
  # Released when no vX.Y.Z tag exists yet. package.json stays at 0.0.0-development.
  FIRST_VERSION: 0.1.0

jobs:
  version:
    name: Compute the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Refuse anything but the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::a release is run from $DEFAULT_BRANCH, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test the version script
        run: .github/scripts/release-version.test.sh

      - id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref | ltrimstr("refs/tags/")')
          version=$(printf '%s\n' "$tags" |
            .github/scripts/release-version.sh "$INPUT_VERSION" "$INPUT_BUMP" "$FIRST_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing v$version from ${GITHUB_SHA::12}"

  image:
    name: Build and push the image
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build the image for this runner
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mewte:release
          cache-from: type=gha

      - name: Check the image starts
        run: .github/scripts/smoke-image.sh mewte:release

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }}
            type=raw,value=latest

      - id: push
        name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the pushed image is the release version on both platforms
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          platforms=$(docker buildx imagetools inspect "$IMAGE:$VERSION@$DIGEST" \
            --format '{{json .Manifest}}' |
            jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')
          echo "$platforms"
          for platform in linux/amd64 linux/arm64; do
            grep -qx "$platform" <<< "$platforms" || {
              echo "::error::$IMAGE:$VERSION has no $platform image"
              exit 1
            }
          done

  release:
    name: Tag and publish the GitHub Release
    needs: [version, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Tag the built commit
        run: |
          tag="v$VERSION"
          # A re-run after the tag was pushed finds it on the built commit and keeps it.
          if existing=$(git ls-remote --exit-code origin "refs/tags/$tag^{}"); then
            if [ "${existing%%[[:space:]]*}" != "$GITHUB_SHA" ]; then
              echo "::error::tag $tag already exists on another commit"
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Mewte $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          # A re-run after the release was published keeps it.
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::release $tag already exists"
            exit 0
          fi
          # shellcheck disable=SC2016 # the backticks are Markdown
          notes=$(printf 'Image: `%s:%s` for linux/amd64 and linux/arm64, digest `%s`.\n' \
            "$IMAGE" "$VERSION" "$DIGEST")
          gh release create "$tag" --verify-tag --title "Mewte $VERSION" \
            --notes "$notes" --generate-notes --latest
