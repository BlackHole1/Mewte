name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: .github/scripts/release-version.test.sh
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run build

  test:
    name: Test (SQLite, PostgreSQL, MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mewte
          POSTGRES_PASSWORD: mewte
          POSTGRES_DB: mewte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mewte -d mewte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mewte
          MYSQL_DATABASE: mewte
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmewte --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_POSTGRES_URL: postgres://mewte:mewte@127.0.0.1:5432/mewte
      TEST_MYSQL_URL: mysql://root:mewte@127.0.0.1:3306/mewte
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mewte:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: .github/scripts/smoke-image.sh mewte:ci
